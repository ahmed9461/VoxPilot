name: maintenance snapshot
on:
  push:
    branches: [maintenance/audit-network-20261027]
    paths: [.github/workflows/maintenance-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/voxpilot-review
          git archive --format=tar HEAD > /tmp/voxpilot-review/source.tar
          git rev-parse HEAD > /tmp/voxpilot-review/source-sha.txt
      - name: Build isolated test wheels
        run: python -m pip wheel '.[dev]' -w /tmp/voxpilot-review/wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-snapshot
          path: /tmp/voxpilot-review
          retention-days: 1
          if-no-files-found: error
