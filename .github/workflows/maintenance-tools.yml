name: maintenance tools
on:
  push:
    branches: [maintenance/audit-network-20261027]
    paths: [.github/workflows/maintenance-tools.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve universal locks and isolated tooling
        run: |
          python -m pip install uv
          python - <<'PY'
          from pathlib import Path
          p = Path('pyproject.toml')
          s = p.read_text().replace('dev = ["pytest>=8", "pytest-asyncio>=0.24"]', 'dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.11", "pip-audit>=2.9"]')
          s = s.replace('"vastai==1.6.0",', '"vastai==1.9.1",\n  "cryptography>=50.0.0",\n  "pillow>=13.0.0",')
          p.write_text(s)
          PY
          mkdir -p /tmp/voxpilot-tools/wheels
          uv pip compile pyproject.toml --universal --no-annotate --no-header -o /tmp/voxpilot-tools/requirements.lock
          uv pip compile pyproject.toml --extra dev --universal --no-annotate --no-header -o /tmp/voxpilot-tools/requirements-dev.lock
          python -m pip wheel -r /tmp/voxpilot-tools/requirements-dev.lock -w /tmp/voxpilot-tools/wheels
          python -m pip install -r /tmp/voxpilot-tools/requirements-dev.lock
          python -m pip_audit -r /tmp/voxpilot-tools/requirements.lock --no-deps --disable-pip --format json --output /tmp/voxpilot-tools/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-tools
          path: /tmp/voxpilot-tools
          retention-days: 1
          if-no-files-found: error
