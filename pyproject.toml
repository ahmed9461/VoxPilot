[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxpilot"
version = "0.1.0"
description = "Owner-only Telegram controller for Fish Audio S2 Pro on temporary Vast.ai GPUs"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.31,<4",
  "httpx>=0.27,<1",
  "msgpack>=1.0,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "vastai==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
voxpilot = "voxpilot.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
